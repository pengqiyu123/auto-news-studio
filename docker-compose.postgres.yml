services:
  postgres:
    image: postgres:16
    container_name: auto-news-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auto_news_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
