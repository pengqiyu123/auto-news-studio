[project]
name = "auto-news-studio"
version = "0.2.13"
dependencies = [
    "jieba>=0.42,<1.0",
    "scikit-learn>=1.4,<2.0",
    "networkx>=3.2,<4.0",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
norecursedirs = ["archive", "data", "frontend", "runtime", "logs", ".ruff_cache"]
